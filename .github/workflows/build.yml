name: Build Report

# data/ 에 엑셀이 올라오면 월간 HTML 리포트를 만들어 reports/ 에 커밋한다.
on:
  push:
    branches: [main]
    paths: ['data/**', 'config/**', 'scripts/**', 'package*.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 리포트 생성
        run: node scripts/build.mjs | tee build.log
      - name: 요약 (Actions 화면 상단에 표시)
        if: always()
        run: |
          echo '### 리포트 생성 결과' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat build.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: reports/ 커밋
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports
          if git diff --cached --quiet; then echo '변경 없음'; exit 0; fi
          git commit -m 'chore: 월간 리포트 자동 생성'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          retention-days: 90
