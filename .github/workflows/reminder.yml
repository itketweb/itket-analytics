name: Month-end Reminder

# 매월 말일(한국시간)에 "엑셀 올려주세요" 이슈를 자동으로 등록한다.
on:
  schedule:
    - cron: '0 0 28-31 * *'   # UTC 00:00 = KST 09:00, 말일 여부는 아래에서 판별
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 말일 판별 및 이슈 등록
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          export TZ=Asia/Seoul
          if [ "$FORCE" != "true" ] && [ "$(date -d tomorrow +%d)" != "01" ]; then echo '오늘은 말일이 아님'; exit 0; fi
          ym=$(date +%Y-%m)
          title="${ym} 애널리틱스 엑셀 업로드"
          if gh issue list --state open --search "\"$title\" in:title" --json title -q '.[].title' | grep -qx "$title"; then echo '이미 등록됨'; exit 0; fi
          menus=$(node -e "console.log(JSON.parse(require('fs').readFileSync('config/menus.json','utf8')).menus.map(m=>'- [ ] '+m.name).join('\n'))")
          body=$(printf '고도몰 관리자 → 통계 → 애널리틱스에서 기간을 이번 달(1일~말일)로 두고 엑셀을 내려받아 `data/%s/` 에 올려 주세요.\n\n파일명: `메뉴명__옵션.xlsx` (예: `인기페이지__PC.xlsx`). 방법은 README 참고.\n\n%s\n\n올리면 리포트가 자동 생성됩니다 (`reports/%s.html`). 모두 올린 뒤 이 이슈를 닫아 주세요.' "$ym" "$menus" "$ym")
          gh issue create --title "$title" --body "$body"
