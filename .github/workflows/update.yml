name: Update Dashboard

# 3시간마다 GA4 데이터를 받아 site/index.html 을 다시 만들고 커밋한다. 사람이 할 일 없음.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'config/**']

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: GA4 수집
        id: collect
        continue-on-error: true
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT: ${{ secrets.GA4_SERVICE_ACCOUNT }}
        run: node scripts/collect.mjs
      - name: 대시보드 생성
        run: node scripts/build-site.mjs
      - name: 변경분 커밋
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data site
          if git diff --cached --quiet; then echo '변경 없음'; exit 0; fi
          git commit -m 'chore: 대시보드 데이터 자동 갱신'
          git push
      - name: 실패 알림 / 복구 처리
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.collect.outcome }}
        run: |
          title='GA4 자동 수집 실패'
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ "$OUTCOME" = "failure" ]; then
            if [ -z "$open" ]; then
              gh issue create --title "$title" --body "자동 수집이 실패했습니다. 대시보드는 마지막으로 성공한 데이터를 계속 보여 줍니다.

          원인 확인: [Actions 실행 기록](${{ github.server_url }}/${{ github.repository }}/actions/workflows/update.yml)
          - 처음 설정이라면 README 의 '처음 한 번만' 을 끝냈는지 확인하세요 (Secret 2개).
          - 서비스 계정이 GA4 속성에서 삭제되었거나 키가 폐기되면 실패합니다.

          다음 실행에서 성공하면 이 이슈는 자동으로 닫힙니다."
            fi
            exit 1
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment '수집이 다시 정상 동작해 자동으로 닫습니다.'
          fi

  deploy:
    needs: update
    # 수집이 실패해도 마지막 성공 데이터로 화면은 계속 배포한다
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
