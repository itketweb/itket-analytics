<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>아이티켓 애널리틱스</title>
<style>
:root{--bg:#f7f8f8;--side:#fbfbfc;--card:#fff;--ink:#0f1011;--ink2:#3c4149;--sub:#62666d;--line:#e6e7ea;--line2:#d4d6db;--acc:#5e6ad2;--accbg:#eceefb;--accink:#4650b8;--up:#1f8a3b;--down:#d92d3a;--warn:#9a5b00;--warnbg:#fff4e0;--bar:#5e6ad2;--bar2:#c9cef3;--sh:0 1px 2px rgba(15,16,17,.04)}
:root[data-theme=dark]{--bg:#08090a;--side:#0b0c0d;--card:#0f1011;--ink:#f7f8f8;--ink2:#d0d6e0;--sub:#8a8f98;--line:#23252a;--line2:#34343a;--acc:#5e6ad2;--accbg:#1a1c33;--accink:#9aa3ff;--up:#3ecf5f;--down:#ff6369;--warn:#f0b04a;--warnbg:#2b2210;--bar:#6c78e6;--bar2:#2c3170;--sh:none}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#08090a;--side:#0b0c0d;--card:#0f1011;--ink:#f7f8f8;--ink2:#d0d6e0;--sub:#8a8f98;--line:#23252a;--line2:#34343a;--acc:#5e6ad2;--accbg:#1a1c33;--accink:#9aa3ff;--up:#3ecf5f;--down:#ff6369;--warn:#f0b04a;--warnbg:#2b2210;--bar:#6c78e6;--bar2:#2c3170;--sh:none}}
*{box-sizing:border-box}
:root{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark}}
.mons,.years{scrollbar-width:none}.mons::-webkit-scrollbar{display:none}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Pretendard","Inter","Malgun Gothic",system-ui,sans-serif;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:9px;padding:2px 6px;font-weight:600;font-size:14px;letter-spacing:-.01em}
.brand i{width:24px;height:24px;border-radius:7px;background:var(--acc);display:grid;place-items:center;color:#fff;flex:none}
.brand i svg{width:14px;height:14px}
.side .lbl{font-size:11px;font-weight:500;color:var(--sub);letter-spacing:.04em;padding:0 8px}
.years{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px}
.y{flex:1;padding:5px 8px;border:0;border-radius:6px;background:none;color:var(--sub);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.y.on{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line),var(--sh)}
.mons{display:flex;flex-direction:column;gap:1px}
.m{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--ink2);border-radius:7px;padding:6px 10px;font-size:13.5px;cursor:pointer;text-align:left}
.m:hover:not(:disabled):not(.on){background:var(--accbg)}
.m.on{background:var(--accbg);color:var(--accink);font-weight:600}
.m:disabled{opacity:.35;cursor:default}
.flag{color:var(--warn);font-weight:700}
.m.all{font-weight:600;margin-bottom:4px}
.side .sfoot{margin-top:auto;font-size:11.5px;color:var(--sub);padding:0 8px;line-height:1.5}
.wrap{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:0 clamp(16px,2.4vw,44px);height:56px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
.top h1{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em;white-space:nowrap}
.top .crumb{color:var(--sub);font-weight:400}
.top .sp{flex:1}
.upd{color:var(--sub);font-size:12.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.upd::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--up);flex:none}
.upd.stale{color:var(--warn);font-weight:600}.upd.stale::before{background:var(--warn)}
.btn{border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:8px;padding:0 11px;height:30px;font-size:13px;font-weight:500;cursor:pointer;box-shadow:var(--sh)}
.btn:hover{background:var(--accbg)}
.btn.ic{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.btn.ic svg{width:15px;height:15px;flex:none}.btn.ic:disabled{opacity:.6;cursor:wait}.btn.ic.spin svg{animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.tgl{position:relative;width:52px;height:28px;border:1px solid var(--line2);border-radius:14px;background:var(--card);cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:space-between;font-size:13px;line-height:1;flex:none}
.tgl .k{width:26px;text-align:center;z-index:1;color:var(--sub)}.tgl i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--acc);opacity:.3;transition:transform .2s}
.tgl[aria-checked=true] i{transform:translateX(24px)}
.cont{padding:20px clamp(16px,2.4vw,44px) 8px;width:100%}
main{padding:0}
.note{background:var(--warnbg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 25%,transparent);border-radius:8px;padding:8px 12px;margin-bottom:16px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--sh)}
.kpi .l{color:var(--sub);font-size:12.5px;font-weight:500}.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0 3px}
.d{font-size:12px;font-weight:600;display:inline-block;margin-right:8px;font-variant-numeric:tabular-nums}.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--sub)}
.d small{font-weight:400;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--sh)}
.card h2{font-size:13.5px;font-weight:600;letter-spacing:-.01em;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;border-radius:6px;background:none;color:var(--sub);padding:3px 10px;font-size:12.5px;font-weight:500;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line),var(--sh)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.grid .card{margin-bottom:0}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--sub);font-size:12px}
svg .g{stroke:var(--line)}
svg rect.b{fill:var(--bar)}svg rect.b2{fill:var(--bar2)}svg rect.hit:hover{fill:var(--accbg)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--sub);font-weight:500;font-size:12px}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
tr.link{cursor:pointer}tr.link:hover td{background:var(--accbg)}
td .tx{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
td .sh{display:block;height:3px;background:var(--bar2);border-radius:2px;margin-top:4px}
.tw{overflow:auto}
.empty{color:var(--sub);padding:28px;text-align:center}
.live{display:grid;grid-template-columns:200px 1fr 1fr;gap:20px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;box-shadow:var(--sh)}
.live .n{font-size:34px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.live .l{color:var(--sub);font-size:12.5px}
.live .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--up);margin-right:6px;animation:pulse 1.6s infinite}
.live .dot.off{background:var(--sub);animation:none}
@keyframes pulse{50%{opacity:.25}}
.live ul{list-style:none;margin:0;padding:0;font-size:13px}
.live li{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.live li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.live svg{height:44px}
.kst{display:flex;gap:28px;flex-wrap:wrap;margin:-2px 0 14px}
.kst div{min-width:90px}.kst .l{font-size:12px;color:var(--sub)}.kst .v{font-size:18px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.kst small{font-size:12px;color:var(--sub);font-weight:400;margin-left:4px}
.dc{position:relative}.dc svg rect.hit,.dc svg rect.hit:hover{fill:transparent;cursor:pointer}
.dc svg text.vl{fill:var(--ink2);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.dc svg text.vl.mx{fill:var(--accink)}
.dc svg text.wk{fill:var(--down)}
.dc svg rect.d1{fill:var(--bar)}.dc svg rect.d1.we{fill:var(--bar);opacity:.42}.dc svg rect.d1.mx{fill:var(--accink)}.dc svg rect.d1.nw{fill:var(--bar2)}
.dc svg rect.hov{fill:var(--accbg);opacity:0}.dc svg rect.hov.on{opacity:.7}
.dc svg line.avg{stroke:var(--warn);stroke-dasharray:4 4;stroke-width:1.2}
.dc svg text.avt{font-size:11.5px;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round;fill:var(--warn);font-weight:600}
.tip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:12.5px;line-height:1.45;box-shadow:0 6px 20px rgba(0,0,0,.18);white-space:nowrap;z-index:4;opacity:0;transition:opacity .08s}
.tip b{display:block;font-size:15px;font-variant-numeric:tabular-nums}.tip span{color:var(--sub)}
.leg{display:flex;gap:14px;font-size:11.5px;color:var(--sub);margin-top:8px;flex-wrap:wrap}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.foot{color:var(--sub);font-size:12px;padding:8px clamp(16px,2.4vw,44px) 24px}
@media (max-width:1000px){.live{grid-template-columns:1fr}}
@media (max-width:860px){
 .app{grid-template-columns:1fr}
 .side{position:static;height:auto;overflow:visible;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px;gap:8px;border-right:0;border-bottom:1px solid var(--line)}
 .side .lbl,.side .sfoot{display:none}.brand{padding:0}
 .years{order:2}.mons{order:3;flex-direction:row;overflow:auto;width:100%;gap:4px}.m{white-space:nowrap;border:1px solid var(--line);padding:4px 11px}
 .top{padding:8px 12px;height:auto;min-height:52px;flex-wrap:wrap;position:static}
 .upd{order:5;width:100%}.btn.ic span{display:none}
 .cont{padding:14px 12px 4px}.foot{padding:8px 12px 24px}
 .grid{grid-template-columns:1fr}td .tx{max-width:180px}
}
@media print{.side,.btn,.tgl,.seg{display:none}.app{display:block}.top{position:static}}
</style>
</head>

  if (!list) return `<div class="card" style="margin-top:14px"><h2>고도몰 인기 항목</h2><div class="empty">이 달은 아직 집계 전입니다. 수집기가 과거 월을 순서대로 채우는 중이면 잠시 후 나타납니다.</div></div>`;
  const tot = list.reduce((a, r) => a + r.views, 0) || 1, mx = Math.max(1, ...list.map((r) => r.views));
  const label = { goods: '상품번호', categories: '카테고리 코드', boards: '게시판 ID' }[shopTab];
  const body = list.length ? `<table><thead><tr><th>#</th><th>이름(페이지 제목)</th><th>${label}</th><th class="n">조회수</th><th class="n">비율</th></tr></thead><tbody>${list.slice(0, 30).map((r, i) => `<tr><td>${i + 1}</td><td><span class="tx" title="${esc(nm(r))}">${esc(nm(r))}</span><span class="sh" style="width:${Math.max(2, r.views / mx * 100)}%"></span></td><td>${esc(r.id)}</td><td class="n">${fmt(r.views)}</td><td class="n">${(r.views / tot * 100).toFixed(1)}%</td></tr>`).join('')}</tbody></table>` : '<div class="empty">데이터 없음</div>';
  return `<div class="card">${head.replace('margin-top:14px', 'margin-top:0')}<div class="tw">${body}</div></div>`;
}
function k2v(r, m) { const s = (m.signups || []).find((x) => x.date === r.date); return { ...r, signups: s ? s.count : 0 }; }

function renderYear(y) {
  const ks = Array.from({ length: 12 }, (_, i) => `${y}-${String(i + 1).padStart(2, '0')}`);
  const val = (k, key) => D.months[k] ? metricOf(D.months[k], key) : 0;
  const vals = ks.map((k) => val(k, annMetric));
  const sum = (key) => ks.reduce((a, k) => a + val(k, key), 0);
  const py = Number(y) - 1;
  const psum = (key) => { const all = Array.from({ length: 12 }, (_, i) => D.months[`${py}-${String(i + 1).padStart(2, '0')}`]); if (all.some((m) => !m || isGap(m))) return null; return all.reduce((a, m) => a + metricOf(m, key), 0); };   // 작년에 공백 월이 있으면 비교하지 않음
  const have = ks.filter((k) => okM(k)).length;
  const cards = [['세션', 'sessions'], ['페이지뷰', 'screenPageViews'], ['신규 방문자', 'newUsers'], ['회원가입', 'signups']].map(([l, key]) => `<div class="kpi"><div class="l">${l} (${y}년 누계)</div><div class="v">${fmt(sum(key))}</div>${have === 12 ? dl(sum(key), psum(key), '전년') : ''}</div>`);
  const rowsHtml = ks.map((k, i) => { const m = okM(k); const gap = isGap(D.months[k]); return `<tr class="${m ? 'link' : ''}" data-s="${m ? k : ''}"><td>${i + 1}월${m && m.partial ? ' <span style="color:var(--sub)">(진행 중)</span>' : ''}</td>${gap ? '<td class="n" colspan="5" style="color:var(--warn)">집계 없음 — 방문 기록 거의 없음 (사이트 미운영 구간 추정)</td>' : m ? ['activeUsers', 'sessions', 'screenPageViews', 'newUsers', 'signups'].map((key) => `<td class="n">${fmt(metricOf(m, key))}</td>`).join('') : '<td class="n" colspan="5" style="color:var(--sub)">―</td>'}</tr>`; }).join('');
  $('main').innerHTML = `
    <div class="kpis">${cards.join('')}</div>
    <div class="card"><h2>월별 추이 ${seg(METRICS, annMetric, 'am')}</h2>${monthlyChart(vals, ks.map((k) => !!okM(k)), ks.map((k) => !!(D.months[k] && D.months[k].partial)), annMetric === 'signups' ? '건' : '', true)}</div>
    <div class="card"><h2>월별 요약 <span style="color:var(--sub);font-size:12px;font-weight:400">행을 누르면 해당 월로 이동 · 방문자는 일별 방문자의 합(고도몰 통계와 같은 방식)입니다</span></h2><div class="tw"><table><thead><tr><th>월</th><th class="n">방문자(일 합)</th><th class="n">세션</th><th class="n">페이지뷰</th><th class="n">신규 방문자</th><th class="n">회원가입</th></tr></thead><tbody>${rowsHtml}</tbody><tfoot><tr><td><b>합계</b></td><td class="n"><b>${fmt(sum('activeUsers'))}</b></td>${['sessions', 'screenPageViews', 'newUsers', 'signups'].map((key) => `<td class="n"><b>${fmt(sum(key))}</b></td>`).join('')}</tr></tfoot></table></div></div>`;
  bindDaily();
  document.querySelectorAll('[data-am]').forEach((b) => b.onclick = () => { annMetric = b.dataset.am; render(); });
  document.querySelectorAll('tr.link').forEach((r) => r.onclick = () => go(r.dataset.s));
  document.querySelectorAll('rect.hit').forEach((r) => r.onclick = () => { const k = ks[+r.dataset.i]; if (okM(k)) go(k); });
}

function render() {
  header();
  if (!keys.length) { $('main').innerHTML = '<div class="empty">아직 수집된 데이터가 없습니다.<br>저장소의 Actions에서 “Update Dashboard”를 실행하면 첫 수집이 시작됩니다.</div>'; return; }
  if (/^\d{4}$/.test(sel)) renderYear(sel); else renderMonth(sel);
}
// ── 실시간: GA4 Realtime API(최근 30분)를 Apps Script 웹앱으로 30초마다 직접 조회 ──
const liveUrl = D.liveUrl || '';
let lastLiveOk = 0;
function renderLive(l, err) {
  const box = $('liveBox');
  if (!liveUrl) { box.innerHTML = ''; return; }
  if (!l) { box.innerHTML = `<div class="live"><div><div class="l"><span class="dot off"></span>실시간</div><div class="n" style="font-size:18px">${err ? '연결 대기 중…' : '불러오는 중…'}</div></div></div>`; return; }
  const mins = Array(30).fill(0);
  (l.minutes || []).forEach((r) => { const i = +r.minutesAgo; if (i >= 0 && i < 30) mins[29 - i] = r.activeUsers; });
  const mx = Math.max(1, ...mins);
  const spark = `<svg viewBox="0 0 300 44" preserveAspectRatio="none" role="img">${mins.map((v, i) => `<rect class="b" x="${i * 10 + 1}" y="${44 - Math.max(1.5, v / mx * 42)}" width="8" height="${Math.max(1.5, v / mx * 42)}" rx="1.5"><title>${30 - i}분 전: ${v}명</title></rect>`).join('')}</svg>`;
  const pages = (l.pages || []).slice(0, 5).map((r) => `<li><span title="${esc(r.unifiedScreenName)}">${esc(r.unifiedScreenName || '(제목 없음)')}</span><span>${fmt(r.activeUsers)}명</span></li>`).join('') || '<li><span style="color:var(--sub)">지금 보는 페이지 없음</span></li>';
  const dev = (l.devices || []).map((r) => `${{ desktop: 'PC', mobile: '모바일', tablet: '태블릿' }[r.deviceCategory] || r.deviceCategory} ${fmt(r.activeUsers)}`).join(' · ');
  const ago = Math.max(0, Math.round((Date.now() - new Date(l.at)) / 1000));
  box.innerHTML = `<div class="live"><div><div class="l"><span class="dot"></span>지금 접속 중 (최근 30분)</div><div class="n">${fmt(l.activeUsers)}명</div><div class="l">${dev || '&nbsp;'} · ${ago < 5 ? '방금' : ago + '초 전'} 갱신</div></div><div><div class="l" style="margin-bottom:2px">분당 접속자 (30분)</div>${spark}</div><div><div class="l" style="margin-bottom:2px">지금 보는 페이지</div><ul>${pages}</ul></div></div>`;
}
async function pollLive() {
  if (!liveUrl || document.visibilityState === 'hidden') return;
  try {
    const r = await fetch(liveUrl + '?mode=live');
    const j = await r.json();
    if (j.error || typeof j.activeUsers !== 'number') throw new Error(j.error || 'bad live payload');
    lastLiveOk = Date.now(); renderLive(j);
  } catch (e) { if (!lastLiveOk) renderLive(null, true); }
}
// 당월 수치: 수집기가 15분마다 갱신 → 화면은 2분마다 가져와 바뀐 경우에만 다시 그린다
async function pollCur() {
  if (!liveUrl || document.visibilityState === 'hidden') return null;
  try {
    const j = await (await fetch(liveUrl + '?mode=cur')).json();
    if (!j.months) return 'fail';
    let changed = false;
    for (const k of Object.keys(j.months)) {
      const old = D.months[k];
      if (!old || old.updated !== j.months[k].updated) { D.months[k] = j.months[k]; changed = true; }
    }
    if (j.updated && j.updated !== D.meta.updated) { D.meta.updated = j.updated; changed = true; }
    if (changed) { const y = scrollY; render(); scrollTo(0, y); }
    return changed ? 'changed' : 'same';
  } catch (e) { return 'fail'; }
}
if (liveUrl) { renderLive(null); pollLive(); pollCur(); setInterval(pollLive, 30000); setInterval(pollCur, 120000); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { pollLive(); pollCur(); } }); }
$('refresh').onclick = async () => {
  if (!liveUrl) { location.reload(); return; }
  const b = $('refresh'); b.disabled = true; b.classList.add('spin');
  const [, r] = await Promise.all([pollLive(), pollCur()]);
  b.disabled = false; b.classList.remove('spin');
  updNote = r === 'fail' ? '⚠ 확인 실패' : r === 'changed' ? '✓ 새 데이터 반영' : '✓ 최신 상태';
  header();
  clearTimeout(updTimer); updTimer = setTimeout(() => { updNote = ''; header(); }, 5000);
};
let rzT, rzW = 0;
addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { const w = $('main').clientWidth; if (!keys.length || Math.abs(w - rzW) < 24) return; rzW = w; const y = scrollY; render(); scrollTo(0, y); }, 200); });
addEventListener('hashchange', () => { const s = location.hash.slice(1); if (s && s !== sel && (D.months[s] || years.includes(s))) { sel = s; render(); } });
render();
</script>
</body>
