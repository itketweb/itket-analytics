<script>
const D = "__DATA__";
const $ = (id) => document.getElementById(id);

const keys = Object.keys(D.months).sort();

if (isPage) sel = keys[keys.length - 1] || '';
let chartMetric = 'activeUsers', srcTab = 'sourceMedium', annMetric = 'sessions', shopTab = 'goods';

const signups = (m) => (m.signups || []).reduce((a, r) => a + r.count, 0);
// 방문자는 고도몰 통계와 같은 방식(일별 방문자의 합)으로 센다. GA4 의 월 중복 제거 값은 m.total.activeUsers(순 방문자).

// 방문자 1명당 조회수가 비정상적으로 높은 페이지(내부 새로고침·자동 접속 의심). 정상 페이지는 1.5~4.6, 의심 페이지는 19~68 (2026-09 실측)

  const list = (m.pages || []).filter((p) => p.screenPageViews > SUSP_MIN_PV && p.screenPageViews / Math.max(1, p.activeUsers) > SUSP_RATIO);
  const excess = list.reduce((a, p) => a + p.screenPageViews - p.activeUsers * NORMAL_RATIO, 0);   // 정상 수준(방문자당 2뷰)을 넘는 분량
  return { list, excess };
};
const sumDays = (m, k, n) => k === 'signups' ? (m.signups || []).filter((r) => +r.date.slice(8) <= n).reduce((a, r) => a + r.count, 0) : m.daily.filter((r) => +r.date.slice(8) <= n).reduce((a, r) => a + r[k], 0);
const prevKey = (k) => { const [y, mo] = k.split('-').map(Number); return mo === 1 ? `${y - 1}-12` : `${y}-${String(mo - 1).padStart(2, '0')}`; };

// 방문 기록이 사실상 없는 달(세션 100 미만, 진행 중인 달 제외) — 비교·합산에서 제외한다
const isGap = (m) => !!m && !m.partial && m.total.sessions < 100;

  if (prev == null || cur == null) return '';

  const p = (cur - prev) / Math.abs(prev) * 100;

  return `<span class="d ${p > 0 ? 'up' : 'down'}">${p > 0 ? '▲' : '▼'} ${Math.abs(p).toFixed(1)}% <small>${label}</small></span>`;

  const el = $('upd');
  $('crumb').textContent = isPage ? '페이지 분석' : sel ? (sel.length === 4 ? sel + '년 연간' : sel.slice(0, 4) + '년 ' + +sel.slice(5) + '월') : '';

  const h = (Date.now() - u) / 36e5;
  const s = u.toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
  el.textContent = `마지막 갱신 ${s} (${h < 1 ? '방금' : h < 24 ? Math.round(h) + '시간 전' : Math.round(h / 24) + '일 전'})`;
  el.classList.toggle('stale', h > 6);
  if (h > 6) el.textContent += ' · 갱신이 지연되고 있습니다';
  $('years').innerHTML = years.map((y) => `<button class="y ${!isPage && sel.startsWith(y) ? 'on' : ''}" data-s="${y}">${y}년</button>`).join('');
  const y = sel.slice(0, 4);
  $('mons').innerHTML = `<button class="m all ${!isPage && sel === y ? 'on' : ''}" data-s="${y}">연간</button>` + Array.from({ length: 12 }, (_, i) => { const k = `${y}-${String(i + 1).padStart(2, '0')}`; const gap = isGap(D.months[k]); return `<button class="m ${!isPage && sel === k ? 'on' : ''}" data-s="${k}" ${D.months[k] && !gap ? '' : 'disabled'}${gap ? ' title="방문 측정이 빠진 달입니다 (고도몰 방문 통계도 0이지만 같은 기간 회원가입은 기록됨 — 측정 누락으로 추정)"' : ''}>${i + 1}월</button>`; }).join('');
  document.querySelectorAll('[data-s]').forEach((b) => b.onclick = () => go(b.dataset.s, b.classList.contains('y')));
  const mo = $('mons'), on = mo.querySelector('.m.on');
  if (on && mo.scrollWidth > mo.clientWidth) mo.scrollLeft = on.offsetLeft - (mo.clientWidth - on.offsetWidth) / 2;
}
function drawer(on) {
  $('side').classList.toggle('open', on); $('scrim').classList.toggle('on', on);
  document.body.classList.toggle('lock', on); $('burger').setAttribute('aria-expanded', on);
}
$('burger').onclick = () => drawer(true);
$('navDash').onclick = () => go(keys[keys.length - 1] || '');
$('navPage').onclick = () => openPage(pageQ, pageM);
$('scrim').onclick = $('sclose').onclick = () => drawer(false);
addEventListener('keydown', (e) => { if (e.key === 'Escape') drawer(false); });
addEventListener('resize', () => { if (innerWidth > 768) drawer(false); });
// 처음 상태로 복귀: 해시·탭·선택 기간을 모두 초기값(가장 최근 달)으로
function goHome() {
  isPage = false; convSel = 'estimate'; convBy = 'byMedium';
  chartMetric = 'activeUsers'; srcTab = 'sourceMedium'; annMetric = 'sessions'; shopTab = 'goods';
  sel = keys[keys.length - 1] || '';
  history.replaceState(null, '', location.pathname + location.search);
  drawer(false); render(); window.scrollTo({ top: 0 });
}
$('brand').onclick = (e) => { if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return; e.preventDefault(); goHome(); };
function go(s, keep) { isPage = false; sel = s; history.replaceState(null, '', '#' + s); if (!keep) drawer(false); render(); window.scrollTo({ top: 0 }); }

const cardPad = () => { const el = document.createElement('div'); el.className = 'card'; el.style.cssText = 'position:absolute;visibility:hidden;width:0;margin:0'; document.body.appendChild(el); const c = getComputedStyle(el); const v = parseFloat(c.paddingLeft) + parseFloat(c.paddingRight) + parseFloat(c.borderLeftWidth) + parseFloat(c.borderRightWidth); el.remove(); return v; };
const chartW = () => Math.max(280, Math.round(($('main').clientWidth || 860) - cardPad()));
// 평균 라벨이 오른쪽 여백에 들어갈 폭(4의 배수)
const avtPad = (label) => 4 * Math.ceil((9 * label.length + 16) / 4);
const axisC = (v) => v >= 1000 ? (+(v / 1000).toFixed(1)) + 'k' : String(Math.round(v));
const fmtC = (v) => v >= 10000 ? (+(v / 10000).toFixed(1)) + '만' : fmt(v);
const coarse = matchMedia('(pointer:coarse)').matches;
function dailyChart(vals, dates, unit) {
  const n = vals.length;
  if (!n) return '<div class="empty">데이터 없음</div>';
  if (Math.max(...vals) <= 0) return '<div class="empty">이 기간에 기록된 값이 없습니다 (모든 날짜 0)</div>';
  const W = chartW(), mob = W < 520, h = mob ? 232 : Math.min(340, Math.max(248, Math.round(W * 0.05) * 4)), pl = mob ? 36 : 48, pr = mob ? 4 : avtPad('평균 ' + fmt(vals.reduce((a, b) => a + b, 0) / n)), pt = 24, pb = 32;
  const mx = Math.max(4, ...vals), e = 10 ** Math.floor(Math.log10(mx)), f = mx / e;
  const nice = (f <= 1 ? 1 : f <= 1.5 ? 1.5 : f <= 2 ? 2 : f <= 3 ? 3 : f <= 5 ? 5 : f <= 7.5 ? 7.5 : 10) * e;
  const todayKST = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' }), iToday = dates.indexOf(todayKST);   // 아직 집계 중인 날
  const all = vals.map((_, i) => i), done = all.filter((i) => i !== iToday), base = done.length ? done : all;
  const bv = base.map((i) => vals[i]);
  const sum = vals.reduce((a, b) => a + b, 0), avg = bv.reduce((a, b) => a + b, 0) / bv.length;
  const rmx = Math.max(...bv), iMax = base.find((i) => vals[i] === rmx), mn = Math.min(...bv), iMin = base.find((i) => vals[i] === mn);
  const bw = (W - pl - pr) / n, y = (v) => pt + (h - pt - pb) * (1 - v / nice);
  const wd = ['일', '월', '화', '수', '목', '금', '토'];
  const dow = (d) => new Date(d + 'T00:00:00').getDay();
  const showAll = n <= 16 && bw >= 36;
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = nice * i / 4, yy = y(v); g += `<line class="g" x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" ${i ? 'stroke-dasharray="2 4"' : ''}/><text x="${pl - 8}" y="${yy + 4}" text-anchor="end">${mob ? axisC(v) : fmt(v)}</text>`; }
  let b = '', hit = '';
  const maxL = Math.max(4, Math.floor((W - pl - pr) / (mob ? 30 : 34))), step = Math.ceil(n / maxL);
  vals.forEach((v, i) => {
    const x = pl + i * bw, yy = y(v), d = dates[i], w = dow(d), we = w === 0 || w === 6;
    const cls = ['d1', i === iToday ? 'pt' : (we ? 'we' : ''), (i === iMax && rmx > 0) ? 'mx' : ''].join(' ');
    b += `<rect class="${cls}" x="${x + bw * 0.16}" y="${yy}" width="${bw * 0.68}" height="${Math.max(v > 0 ? 1.5 : 0, h - pb - yy)}" rx="3"/>`;
    if (showAll || i === iMax || (!mob && i === n - 1)) b += `<text class="vl ${i === iMax ? 'mx' : ''}" x="${x + bw / 2}" y="${yy - 5}" text-anchor="middle">${fmt(v)}</text>`;
    if (i % step === 0 || (!mob && i === n - 1)) b += `<text x="${x + bw / 2}" y="${h - 17}" text-anchor="middle">${+d.slice(8)}</text><text class="${we ? 'wk' : ''}" x="${x + bw / 2}" y="${h - 5}" text-anchor="middle" style="font-size:0.625rem">${wd[w]}</text>`;
    hit += `<rect class="hit" data-i="${i}" x="${x}" y="${pt - 14}" width="${bw}" height="${h - pt - pb + 14}" fill="transparent"/>`;
  });
  const ay = y(avg);
  const svg = `<svg viewBox="0 0 ${W} ${h}" role="img" aria-label="일별 추이"><defs><pattern id="ph" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="phb" width="3" height="6"/></pattern></defs>${g}<rect class="hov" x="0" y="${pt - 14}" width="${bw}" height="${h - pt - pb + 14}" rx="4"/>${b}<line class="avg" x1="${pl}" x2="${W - pr}" y1="${ay}" y2="${ay}"/><text class="avt" x="${mob ? pl + 6 : W - pr + 8}" y="${mob ? ay - 5 : ay + 4}" text-anchor="start">평균 ${fmt(avg)}</text>${hit}</svg>`;
  const md = (d) => `${+d.slice(5, 7)}/${+d.slice(8)}(${wd[dow(d)]})`;
  const stats = `<div class="kst"><div><div class="l">합계</div><div class="v">${fmt(sum)}${unit}</div></div><div><div class="l">일평균</div><div class="v">${fmt(avg)}${unit}</div></div><div><div class="l">최고</div><div class="v">${fmt(rmx)}<small>${md(dates[iMax])}</small></div></div><div><div class="l">최저</div><div class="v">${fmt(mn)}<small>${md(dates[iMin])}</small></div></div></div>`;
  const legend = `<div class="leg"><span><i class="s-bar"></i>평일</span><span><i class="s-we"></i>주말</span>${iToday >= 0 ? '<span><i class="s-pt"></i>오늘(집계 중, 평균·최고·최저 제외)</span>' : ''}<span><i class="s-hi"></i>최고</span><span><i class="s-avg"></i>일평균</span></div>`;
  return `${stats}<div class="dc" id="dc" data-v='${JSON.stringify(vals)}' data-t='${JSON.stringify(dates.map((d, i) => `${+d.slice(5, 7)}월 ${+d.slice(8)}일 (${wd[dow(d)]})${i === iToday ? ' · 집계 중' : ''}`))}' data-a="${avg}" data-u="${unit}" data-g='${JSON.stringify({ W, h, pl, pr, pt, pb, bw, nice })}'>${svg}<div class="tip" id="tip"></div></div>${legend}`;
}
function monthlyChart(vals, have, partial, unit, sumOk) {
  const idx = vals.map((v, i) => i).filter((i) => have[i]);
  if (!idx.length || Math.max(...idx.map((i) => vals[i])) <= 0) return '<div class="empty">이 기간에 기록된 값이 없습니다</div>';
  const W = chartW(), mob = W < 520, h = mob ? 232 : Math.min(340, Math.max(248, Math.round(W * 0.05) * 4)), pl = mob ? 36 : 48, pr = mob ? 4 : avtPad('월평균 ' + fmt((idx.filter((i) => !partial[i]).length ? idx.filter((i) => !partial[i]) : idx).reduce((a, i, _, r) => a + vals[i] / r.length, 0))), pt = 24, pb = 24, n = 12;
  const allv = idx.map((i) => vals[i]), lastI = idx[idx.length - 1];
  const done = idx.filter((i) => !partial[i]), base = done.length ? done : idx; // 진행 중인 달은 평균·최고·최저에서 제외
  const real = base.map((i) => vals[i]), rmx = Math.max(...real), rmn = Math.min(...real);
  const iMax = base.find((i) => vals[i] === rmx), iMin = base.find((i) => vals[i] === rmn);
  const sum = allv.reduce((a, b) => a + b, 0), avg = real.reduce((a, b) => a + b, 0) / real.length;
  const top = Math.max(4, ...allv), e = 10 ** Math.floor(Math.log10(top)), f = top / e;

  const bw = (W - pl - pr) / n, y = (v) => pt + (h - pt - pb) * (1 - v / nice);
  let g = '', b = '', hit = '';
  for (let i = 0; i <= 4; i++) { const v = nice * i / 4, yy = y(v); g += `<line class="g" x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" ${i ? 'stroke-dasharray="2 4"' : ''}/><text x="${pl - 8}" y="${yy + 4}" text-anchor="end">${mob ? axisC(v) : fmt(v)}</text>`; }
  vals.forEach((v, i) => {
    const x = pl + i * bw;
    b += `<text x="${x + bw / 2}" y="${h - 6}" text-anchor="middle">${i + 1}${mob ? '' : '월'}</text>`;
    if (!have[i]) return;
    const yy = y(v);
    b += `<rect class="d1 ${partial[i] ? 'pt' : ''} ${i === iMax ? 'mx' : ''}" x="${x + bw * 0.18}" y="${yy}" width="${bw * 0.64}" height="${Math.max(v > 0 ? 1.5 : 0, h - pb - yy)}" rx="3"/>`;
    if (bw >= 40 || i === iMax || i === lastI) b += `<text class="vl ${i === iMax ? 'mx' : ''}" x="${x + bw / 2}" y="${yy - 5}" text-anchor="middle">${bw >= 40 ? fmt(v) : fmtC(v)}</text>`;
    hit += `<rect class="hit" data-i="${i}" x="${x}" y="${pt - 14}" width="${bw}" height="${h - pt - pb + 14}" fill="transparent"/>`;

  const smax = Math.max(1, ...(r.sources || []).map((x) => x.sessions));
  const sources = tbl(['유입 매체', '세션', '조회수'], (r.sources || []).map((x) => `<tr><td><span class="tx" title="${esc(x.sessionSourceMedium)}">${esc(x.sessionSourceMedium)}</span><span class="sh" style="width:${Math.max(2, x.sessions / smax * 100)}%"></span></td><td class="n">${fmt(x.sessions)}</td><td class="n">${fmt(x.screenPageViews)}</td></tr>`));
  const devices = tbl(['기기', '방문자', '조회수'], (r.devices || []).map((x) => `<tr><td>${esc(x.deviceCategory)}</td><td class="n">${fmt(x.activeUsers)}</td><td class="n">${fmt(x.screenPageViews)}</td></tr>`));
  const urls = tbl(['주소(쿼리 포함)', '조회수', '방문자'], (r.urls || []).map((x) => `<tr><td><span class="tx" title="${esc(x.pagePathPlusQueryString)}">${esc(x.pagePathPlusQueryString)}</span></td><td class="n">${fmt(x.screenPageViews)}</td><td class="n">${fmt(x.activeUsers)}</td></tr>`));
  const events = tbl(['이벤트', '횟수'], (r.events || []).map((x) => `<tr><td>${esc(x.eventName)}</td><td class="n">${fmt(x.eventCount)}</td></tr>`));
  const en = r.entry || { sessions: 0, conv: {}, byMedium: {} };
  const convRows = (r.defs || []).map((d) => { const s = en.conv[d.id] || 0; const meds = (en.byMedium[d.id] || []).slice(0, 3).map((x) => `${esc(x.k)} ${fmt(x.s)}`).join(' · '); return `<tr><td>${esc(d.name)}</td><td class="n">${fmt(s)}</td><td class="n rate">${pct(s, en.sessions)}</td><td class="hm" style="color:var(--sub)">${meds || '―'}</td></tr>`; });
  const conv = en.sessions ? `<table><thead><tr><th>전환</th><th class="n">전환 세션</th><th class="n">전환율</th><th class="hm">많이 전환한 유입</th></tr></thead><tbody>${convRows.join('')}</tbody></table><p class="hint">이 페이지로 <b>처음 들어온 방문</b> ${fmt(en.sessions)}회 중 전환 화면까지 간 세션입니다. 이 페이지를 거쳐 간 모든 전환이 아니라 “여기서 시작한” 전환입니다.</p>` : '<div class="empty">이 페이지로 처음 들어온 방문이 없어 전환율을 계산할 수 없습니다 (다른 페이지에서 넘어온 조회만 있음).</div>';
  const errs = (r.errors || []).length ? `<div class="note">일부 항목을 가져오지 못했습니다: ${esc(r.errors.join(' / '))}</div>` : '';
  const ago = r.at ? Math.max(0, Math.round((Date.now() - new Date(r.at)) / 60000)) : 0;
  return `${warn}${errs}<div class="kpis">${kpis}</div>
    <div class="card"><h2>일별 조회수 — “${esc(r.q)}” <span style="color:var(--sub);font-size:0.75rem;font-weight:400">${r.month}${r.partial ? ' (진행 중)' : ''} · ${ago < 1 ? '방금' : ago + '분 전'} 조회</span></h2>${dailyChart(sv, dates, '')}</div>
    <div class="grid"><div class="card"><h2>월별 추이</h2><div class="tw">${monthly}</div></div><div class="card"><h2>유입 매체</h2><div class="tw">${sources}</div></div></div>
    <div class="grid"><div class="card"><h2>전환 (이 페이지로 시작한 방문)</h2><div class="tw">${conv}</div></div><div class="card"><h2>기기</h2><div class="tw">${devices}</div></div></div>
    <div class="grid"><div class="card"><h2>합쳐진 주소 (상위 15)</h2><div class="tw">${urls}</div></div><div class="card"><h2>이 페이지에서 발생한 이벤트</h2><div class="tw">${events}</div></div></div>`;
}

function render() {
  header();
  $('navDash').classList.toggle('on', !isPage); $('navPage').classList.toggle('on', isPage);
  if (isPage) { renderPage(); return; }
  if (!keys.length) { $('main').innerHTML = '<div class="empty">아직 수집된 데이터가 없습니다.<br>저장소의 Actions에서 “Update Dashboard”를 실행하면 첫 수집이 시작됩니다.</div>'; return; }
  if (/^\d{4}$/.test(sel)) renderYear(sel); else renderMonth(sel);
}
// ── 실시간: GA4 Realtime API(최근 30분)를 Apps Script 웹앱으로 15초마다 확인(GA4 호출은 30초 단위) ──
const liveUrl = D.liveUrl || '';
let lastLiveOk = 0;
// 방치된 탭이 GA4 시간당 한도를 계속 쓰지 않도록, 15분 동안 조작이 없으면 실시간 갱신을 멈추고 조작하면 다시 시작한다
let lastAct = Date.now(), livePaused = false;
const IDLE_MS = 15 * 60 * 1000;
function renderLivePaused() {
  $('liveBox').innerHTML = '<div class="live"><div><div class="l lh"><span class="dot off"></span>실시간 일시정지</div><div class="n msg">오래 사용하지 않아 갱신을 멈췄습니다</div><div class="l">화면을 누르거나 움직이면 다시 시작합니다</div></div></div>';
}
['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach((ev) => addEventListener(ev, () => { lastAct = Date.now(); if (livePaused) { livePaused = false; pollLive(); } }, { passive: true }));
// 직전 값과 비교해 변화(▲▼)를 잠깐 보여 준다 — 한도를 쓰지 않는 화면 효과
let lastLive = null, deltaInfo = null;
const agoText = (sec) => sec < 5 ? '방금' : sec < 90 ? sec + '초 전' : Math.round(sec / 60) + '분 전';
let rollTk = 0;
// 바뀐 자릿수만 굴린다: 커지면 아래→위, 작아지면 위→아래 (오른쪽 끝 자리부터 맞춰 비교)
function odometer(a, b) {
  const x = [...fmt(a)].reverse(), y = [...fmt(b)].reverse(), dir = b > a ? 'ru' : 'rd', out = [];
  for (let i = 0; i < Math.max(x.length, y.length); i++) {
    const o = x[i] ?? '', n = y[i] ?? '';
    out.unshift(o === n ? n : `<span class="roll ${dir}${n === '' ? ' gone' : ''}"><i aria-hidden="true">${o}</i><b>${n}</b></span>`);
  }
  return out.join('');
}
function renderLive(l, err) {
  const box = $('liveBox');
  if (!liveUrl) { box.innerHTML = ''; return; }
  if (!l) { box.innerHTML = `<div class="live"><div><div class="l lh"><span class="dot off"></span>실시간</div><div class="n msg">${err ? '연결 대기 중…' : '불러오는 중…'}</div></div></div>`; return; }
  let rollFrom = null;
  if (!lastLive || lastLive.at !== l.at) {
    if (lastLive && typeof lastLive.activeUsers === 'number' && l.activeUsers !== lastLive.activeUsers) { deltaInfo = { d: l.activeUsers - lastLive.activeUsers, until: Date.now() + 15000 }; rollFrom = lastLive.activeUsers; }
    lastLive = l;
  }
  const mins = Array(30).fill(0);
  (l.minutes || []).forEach((r) => { const i = +r.minutesAgo; if (i >= 0 && i < 30) mins[29 - i] = r.activeUsers; });
  const mx = Math.max(1, ...mins);
  const spark = `<svg viewBox="0 0 300 44" preserveAspectRatio="none" role="img">${mins.map((v, i) => `<rect class="b" x="${i * 10 + 1}" y="${44 - Math.max(1.5, v / mx * 42)}" width="8" height="${Math.max(1.5, v / mx * 42)}" rx="1.5"><title>${30 - i}분 전: ${v}명</title></rect>`).join('')}</svg>`;
  const pages = (l.pages || []).slice(0, 5).map((r) => `<li><span title="${esc(r.unifiedScreenName)}">${esc(r.unifiedScreenName || '(제목 없음)')}</span><span>${fmt(r.activeUsers)}명</span></li>`).join('') || '<li><span style="color:var(--sub)">지금 보는 페이지 없음</span></li>';
  const dev = (l.devices || []).map((r) => `${{ desktop: 'PC', mobile: '모바일', tablet: '태블릿' }[r.deviceCategory] || r.deviceCategory} ${fmt(r.activeUsers)}`).join(' · ');
  const ago = Math.max(0, Math.round((Date.now() - new Date(l.at)) / 1000));
  const chip = deltaInfo && deltaInfo.until > Date.now() ? `<span class="chip ${deltaInfo.d > 0 ? 'up' : 'down'}">${deltaInfo.d > 0 ? '▲ +' : '▼ '}${deltaInfo.d}</span>` : '';
  box.innerHTML = `<div class="live"><div><div class="l lh"><span class="dot${l.stale ? ' off' : ''}"></span>지금 접속 중 (최근 30분)</div><div class="n">${rollFrom != null ? odometer(rollFrom, l.activeUsers) : fmt(l.activeUsers)}명${chip}</div><div class="l">${dev || '&nbsp;'} · <span id="liveAgo" data-at="${l.at}">${agoText(ago)}</span> 갱신${l.stale ? ' · 조회 한도로 지연(최근 성공값)' : ''}</div></div><div><div class="l lh">분당 접속자 (30분)</div>${spark}</div><div><div class="l lh">지금 보는 페이지</div><ul>${pages}</ul></div></div>`;
  const tk = ++rollTk;
  if (rollFrom != null) setTimeout(() => { if (tk !== rollTk) return; box.querySelectorAll('.roll>i, .roll.gone').forEach((e) => e.remove()); }, 700);
}
// "N초 전"을 1초마다 올리고, 변화 표시는 15초 뒤 자연스럽게 지운다
setInterval(() => {
  const el = $('liveAgo');
  if (el) el.textContent = agoText(Math.max(0, Math.round((Date.now() - new Date(el.dataset.at)) / 1000)));
  if (deltaInfo && deltaInfo.until <= Date.now()) { deltaInfo = null; const c = document.querySelector('.live .chip'); if (c) c.remove(); }
}, 1000);
async function pollLive() {
  if (!liveUrl || document.visibilityState === 'hidden') return;
  if (Date.now() - lastAct > IDLE_MS) { if (!livePaused) { livePaused = true; renderLivePaused(); } return; }
  try {
    const r = await fetch(liveUrl + '?mode=live');
    const j = await r.json();
    if (j.error || typeof j.activeUsers !== 'number') throw new Error(j.error || 'bad live payload');
    lastLiveOk = Date.now();
    if (lastLive && lastLive.at === j.at && !!lastLive.stale === !!j.stale) return;   // 서버 캐시 응답(새 측정 없음)
    renderLive(j);
  } catch (e) { if (!lastLiveOk) renderLive(null, true); }
}
// 당월 수치: 수집기가 15분마다 갱신 → 화면은 5분마다 가져와 바뀐 경우에만 다시 그린다
async function pollCur() {
  if (!liveUrl || document.visibilityState === 'hidden') return;
  try {
    const j = await (await fetch(liveUrl + '?mode=cur')).json();
    if (!j.months) return;
    let changed = false;
    for (const k of Object.keys(j.months)) {
      const old = D.months[k];
      if (!old || old.updated !== j.months[k].updated) { D.months[k] = j.months[k]; changed = true; }
    }
    if (j.updated && j.updated !== D.meta.updated) { D.meta.updated = j.updated; changed = true; }
    if (changed) { const y = scrollY; render(); scrollTo(0, y); }
  } catch (e) {}
}
if (liveUrl) { renderLive(null); pollLive(); pollCur(); setInterval(pollLive, 15000); setInterval(pollCur, 300000); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { pollLive(); pollCur(); } }); }
let rzT, rzW = 0;
addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { const w = $('main').clientWidth; if (!keys.length || Math.abs(w - rzW) < 24) return; rzW = w; const y = scrollY; render(); scrollTo(0, y); }, 200); });
addEventListener('hashchange', () => { if (readHash()) { if (!pageM) pageM = keys[keys.length - 1] || ''; render(); if (pageQ) loadPage(); return; } const s = location.hash.slice(1); if (s && (D.months[s] || years.includes(s))) { sel = s; render(); } else if (isPage === false && !s) render(); });
render();
if (isPage && pageQ) loadPage();
</script>
</body>
</html>
