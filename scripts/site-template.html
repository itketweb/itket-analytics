<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>__TITLE__</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1b2330;--sub:#667085;--line:#e3e7ee;--acc:#2f6fed;--accbg:#e9f0fe;--up:#0f9d58;--down:#d93025;--warn:#a85d00;--warnbg:#fff3df;--bar:#2f6fed;--bar2:#b9cffa}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f131a;--card:#171d27;--ink:#e7ebf1;--sub:#93a0b4;--line:#283140;--acc:#6fa0ff;--accbg:#1b2a47;--up:#4cc38a;--down:#ff7b72;--warn:#f0b04a;--warnbg:#3a2d12;--bar:#6fa0ff;--bar2:#2b4680}}
:root[data-theme=dark]{--bg:#0f131a;--card:#171d27;--ink:#e7ebf1;--sub:#93a0b4;--line:#283140;--acc:#6fa0ff;--accbg:#1b2a47;--up:#4cc38a;--down:#ff7b72;--warn:#f0b04a;--warnbg:#3a2d12;--bar:#6fa0ff;--bar2:#2b4680}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Pretendard","Malgun Gothic",system-ui,sans-serif}
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.in{max-width:1200px;margin:0 auto;padding:0 16px}
.bar1{display:flex;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}
.bar1 h1{font-size:17px;margin:0;flex:1;min-width:180px}
.upd{color:var(--sub);font-size:12.5px}.upd.stale{color:var(--warn);font-weight:600}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.btn.ic{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.btn.ic svg{width:15px;height:15px;flex:none}.btn.ic:disabled{opacity:.6;cursor:wait}.btn.ic.spin svg{animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.tgl{position:relative;width:52px;height:28px;border:1px solid var(--line);border-radius:14px;background:var(--bg);cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:space-between;font-size:13px;line-height:1}
.tgl .k{width:26px;text-align:center;z-index:1;color:var(--sub)}.tgl i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--acc);opacity:.35;transition:transform .2s}
.tgl[aria-checked=true] i{transform:translateX(24px)}
.years{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow:auto}
.y{padding:8px 16px;border:0;background:none;color:var(--sub);font:inherit;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.y.on{color:var(--acc);border-color:var(--acc)}
.mons{display:flex;gap:6px;padding:10px 0;overflow:auto}
.m{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 13px;font:inherit;font-size:13.5px;cursor:pointer;white-space:nowrap}
.m.on{background:var(--acc);border-color:var(--acc);color:#fff}
.m:disabled{opacity:.35;cursor:default}
.m.all{font-weight:600}
main{max-width:1200px;margin:0 auto;padding:16px}
.note{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:9px 14px;margin-bottom:14px;font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.kpi .l{color:var(--sub);font-size:13px}.kpi .v{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}
.d{font-size:12.5px;font-weight:600;display:inline-block;margin-right:8px}.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--sub)}
.d small{font-weight:400;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;color:var(--sub);padding:4px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.seg button.on{background:var(--accbg);color:var(--acc);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid .card{margin-bottom:0}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--sub);font-size:11px}
svg .g{stroke:var(--line)}
svg rect.b{fill:var(--bar)}svg rect.b2{fill:var(--bar2)}svg rect.hit:hover{fill:var(--accbg)}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--sub);font-weight:600;font-size:12.5px}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
tr.link{cursor:pointer}tr.link:hover td{background:var(--accbg)}
td .tx{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
td .sh{display:block;height:3px;background:var(--bar2);border-radius:2px;margin-top:3px}
.tw{overflow:auto}
.empty{color:var(--sub);padding:28px;text-align:center}
.live{display:grid;grid-template-columns:200px 1fr 1fr;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.live .n{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.live .l{color:var(--sub);font-size:12.5px}
.live .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--up);margin-right:6px;animation:pulse 1.6s infinite}
.live .dot.off{background:var(--sub);animation:none}
@keyframes pulse{50%{opacity:.25}}
.live ul{list-style:none;margin:0;padding:0;font-size:13px}
.live li{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.live li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}
.live svg{height:44px}
@media (max-width:820px){.live{grid-template-columns:1fr}}
.foot{color:var(--sub);font-size:12px;text-align:center;padding:10px 0 24px}
@media (max-width:820px){.grid{grid-template-columns:1fr}td .tx{max-width:180px}}
@media print{.top .years,.top .mons,.btn,.tgl,.seg{display:none}.top{position:static}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="bar1"><h1>__TITLE__</h1><span class="upd" id="upd"></span><button class="btn ic" id="refresh" title="최신 데이터로 업데이트"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg><span>업데이트</span></button><button class="tgl" id="theme" role="switch" aria-label="다크 모드" title="테마 전환"><span class="k">☀</span><span class="k">☾</span><i></i></button><button class="btn ic" onclick="print()" title="인쇄 / PDF 저장"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="6" y="14" width="12" height="7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/></svg><span>인쇄/PDF</span></button></div>
  <div class="years" id="years"></div>
  <div class="mons" id="mons"></div>
</div></div>
<div id="liveBox" style="max-width:1200px;margin:0 auto;padding:16px 16px 0"></div>
<main id="main"></main>
<div class="foot">출처: Google Analytics 4 · 수집 15분마다 · 화면 2분마다 갱신 · 접속자 30초마다 · 고도몰 애널리틱스와 수치 정의가 달라 값이 다를 수 있습니다.</div>
<script>
const D = "__DATA__";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (n) => (n == null || isNaN(n) ? '―' : Math.round(n).toLocaleString('ko-KR'));
const dur = (s) => { if (!s || isNaN(s)) return '―'; s = Math.round(s); return s >= 60 ? `${Math.floor(s / 60)}분 ${String(s % 60).padStart(2, '0')}초` : `${s}초`; };
try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
const isDark = () => { const r = document.documentElement; return r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches; };
const syncTheme = () => $('theme').setAttribute('aria-checked', isDark());
syncTheme();
$('theme').onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('theme', r.dataset.theme); } catch (e) {} syncTheme(); };

const keys = Object.keys(D.months).sort();
const years = [...new Set(keys.map((k) => k.slice(0, 4)))];
let sel = location.hash.slice(1);
if (!sel || (!D.months[sel] && !years.includes(sel))) sel = keys[keys.length - 1] || '';
let chartMetric = 'activeUsers', srcTab = 'sourceMedium', annMetric = 'sessions', shopTab = 'goods';

const signups = (m) => (m.signups || []).reduce((a, r) => a + r.count, 0);
const metricOf = (m, k) => k === 'signups' ? signups(m) : m.total[k];
const sumDays = (m, k, n) => k === 'signups' ? (m.signups || []).filter((r) => +r.date.slice(8) <= n).reduce((a, r) => a + r.count, 0) : m.daily.filter((r) => +r.date.slice(8) <= n).reduce((a, r) => a + r[k], 0);
const prevKey = (k) => { const [y, mo] = k.split('-').map(Number); return mo === 1 ? `${y - 1}-12` : `${y}-${String(mo - 1).padStart(2, '0')}`; };
const yoyKey = (k) => `${+k.slice(0, 4) - 1}-${k.slice(5)}`;
const dl = (cur, prev, label) => {
  if (prev == null || cur == null) return '';
  if (prev === 0) return cur === 0 ? '' : `<span class="d up">신규 <small>${label}</small></span>`;
  const p = (cur - prev) / Math.abs(prev) * 100;
  if (Math.abs(p) < 0.05) return `<span class="d flat">― <small>${label}</small></span>`;
  return `<span class="d ${p > 0 ? 'up' : 'down'}">${p > 0 ? '▲' : '▼'} ${Math.abs(p).toFixed(1)}% <small>${label}</small></span>`;
};

function header() {
  const u = D.meta.updated ? new Date(D.meta.updated) : null;
  const el = $('upd');
  if (!u) { el.textContent = '아직 수집된 데이터가 없습니다'; return; }
  const h = (Date.now() - u) / 36e5;
  const s = u.toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
  el.textContent = `마지막 갱신 ${s} (${h < 1 ? '방금' : h < 24 ? Math.round(h) + '시간 전' : Math.round(h / 24) + '일 전'})`;
  el.classList.toggle('stale', h > 6);
  if (h > 6) el.textContent += ' · 갱신이 지연되고 있습니다';
  $('years').innerHTML = years.map((y) => `<button class="y ${sel.startsWith(y) ? 'on' : ''}" data-s="${y}">${y}년</button>`).join('');
  const y = sel.slice(0, 4);
  $('mons').innerHTML = `<button class="m all ${sel === y ? 'on' : ''}" data-s="${y}">연간</button>` + Array.from({ length: 12 }, (_, i) => { const k = `${y}-${String(i + 1).padStart(2, '0')}`; return `<button class="m ${sel === k ? 'on' : ''}" data-s="${k}" ${D.months[k] ? '' : 'disabled'}>${i + 1}월</button>`; }).join('');
  document.querySelectorAll('[data-s]').forEach((b) => b.onclick = () => go(b.dataset.s));
}
function go(s) { sel = s; history.replaceState(null, '', '#' + s); render(); window.scrollTo({ top: 0 }); }

function bars(vals, labels, { h = 190, fmtv = fmt, onClick, hi } = {}) {
  const W = 800, pl = 46, pr = 8, pt = 8, pb = 22, n = vals.length;
  const mx = Math.max(1, ...vals), nice = (() => { const e = 10 ** Math.floor(Math.log10(mx)); const f = mx / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * e; })();
  const bw = (W - pl - pr) / n, y = (v) => pt + (h - pt - pb) * (1 - v / nice);
  let s = `<svg viewBox="0 0 ${W} ${h}" role="img">`;
  for (let i = 0; i <= 3; i++) { const v = nice * i / 3, yy = y(v); s += `<line class="g" x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}"/><text x="${pl - 6}" y="${yy + 4}" text-anchor="end">${fmt(v)}</text>`; }
  const step = Math.ceil(n / 15);
  vals.forEach((v, i) => {
    const x = pl + i * bw, yy = y(v);
    s += `<rect class="${i === hi ? 'b' : 'b'}" x="${x + bw * 0.14}" y="${yy}" width="${bw * 0.72}" height="${Math.max(0, h - pb - yy)}" rx="2"><title>${esc(labels[i])}: ${fmtv(v)}</title></rect>`;
    if (i % step === 0 || n <= 12) s += `<text x="${x + bw / 2}" y="${h - 6}" text-anchor="middle">${esc(labels[i])}</text>`;
    if (onClick) s += `<rect class="hit" data-i="${i}" x="${x}" y="${pt}" width="${bw}" height="${h - pt - pb}" fill="transparent" style="cursor:pointer"/>`;
  });
  return s + '</svg>';
}

const METRICS = [['activeUsers', '방문자'], ['sessions', '세션'], ['screenPageViews', '페이지뷰'], ['newUsers', '신규 방문자'], ['signups', '회원가입']];
const seg = (items, cur, attr) => `<span class="seg">${items.map(([k, l]) => `<button class="${k === cur ? 'on' : ''}" data-${attr}="${k}">${l}</button>`).join('')}</span>`;

function renderMonth(k) {
  const m = D.months[k], prev = D.months[prevKey(k)], yoy = D.months[yoyKey(k)];
  const n = m.partial ? m.daily.length : null; // 진행 중인 달은 전월 같은 기간과 비교
  const cards = [['방문자', 'activeUsers'], ['신규 방문자', 'newUsers'], ['세션', 'sessions'], ['페이지뷰', 'screenPageViews'], ['회원가입', 'signups']].map(([l, key]) => {
    const cur = metricOf(m, key);
    let d = '';
    if (n) { if (prev && key !== 'activeUsers') d = dl(cur, sumDays(prev, key, n), '전월 동기간'); }
    else { d = dl(cur, prev && metricOf(prev, key), '전월') + dl(cur, yoy && metricOf(yoy, key), '전년'); }
    return `<div class="kpi"><div class="l">${l}</div><div class="v">${fmt(cur)}</div>${d}</div>`;
  });
  const avg = m.total.activeUsers ? m.total.userEngagementDuration / m.total.activeUsers : 0;
  const pa = prev && prev.total.activeUsers ? prev.total.userEngagementDuration / prev.total.activeUsers : null;
  cards.push(`<div class="kpi"><div class="l">방문자당 체류시간</div><div class="v">${dur(avg)}</div>${n ? '' : dl(avg, pa, '전월')}</div>`);
  const series = m.daily.map((r) => k2v(r, m));
  const labels = m.daily.map((r) => +r.date.slice(8) + '일');
  const tot = (rowsx, key) => rowsx.reduce((a, r) => a + (r[key] || 0), 0);
  const src = {
    sourceMedium: ['유입 매체', m.sources, 'sessionSourceMedium', 'sessions', ['세션', 'sessions'], ['방문자', 'activeUsers']],
    channel: ['채널', m.channels, 'sessionDefaultChannelGroup', 'sessions', ['세션', 'sessions'], ['방문자', 'activeUsers']],
    utm: ['UTM 캠페인', m.campaigns, 'sessionCampaignName', 'sessions', ['세션', 'sessions'], ['방문자', 'activeUsers']],
    device: ['기기', m.devices, 'deviceCategory', 'sessions', ['세션', 'sessions'], ['방문자', 'activeUsers']],
  }[srcTab];
  const srows = src[1].slice(0, 12), stot = tot(src[1], src[3]) || 1;
  const stable = srows.length ? `<table><thead><tr><th>${src[0]}</th><th class="n">${src[4][0]}</th><th class="n">${src[5][0]}</th></tr></thead><tbody>${srows.map((r) => `<tr><td><span class="tx" title="${esc(r[src[2]])}">${esc(r[src[2]])}${srcTab === 'utm' ? ` <span style="color:var(--sub)">· ${esc(r.sessionSourceMedium)}</span>` : ''}</span><span class="sh" style="width:${Math.max(2, r[src[3]] / stot * 100)}%"></span></td><td class="n">${fmt(r[src[4][1]])}</td><td class="n">${fmt(r[src[5][1]])}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">데이터 없음 (UTM이 붙은 유입이 없으면 비어 있습니다)</div>';
  const pmax = Math.max(1, ...m.pages.map((p) => p.screenPageViews));
  const ptable = m.pages.length ? `<table><thead><tr><th>페이지</th><th class="n">조회수</th><th class="n">방문자</th><th class="n">체류</th></tr></thead><tbody>${m.pages.slice(0, 15).map((p) => `<tr><td><span class="tx" title="${esc(p.pagePath)}">${esc(p.pagePath)}</span><span class="sh" style="width:${Math.max(2, p.screenPageViews / pmax * 100)}%"></span></td><td class="n">${fmt(p.screenPageViews)}</td><td class="n">${fmt(p.activeUsers)}</td><td class="n">${dur(p.activeUsers ? p.userEngagementDuration / p.activeUsers : 0)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">데이터 없음</div>';
  $('main').innerHTML = `
    ${m.partial ? `<div class="note">진행 중인 달입니다 (${m.daily.length}일차까지 집계). 전월 대비는 같은 기간끼리 비교합니다.</div>` : ''}
    <div class="kpis">${cards.join('')}</div>
    <div class="card"><h2>일별 추이 ${seg(METRICS, chartMetric, 'cm')}</h2>${bars(series.map((r) => r[chartMetric]), labels)}</div>
    <div class="grid">
      <div class="card"><h2>인기 페이지</h2><div class="tw">${ptable}</div></div>
      <div class="card"><h2>유입 ${seg([['sourceMedium', '매체'], ['channel', '채널'], ['utm', 'UTM'], ['device', '기기']], srcTab, 'st')}</h2><div class="tw">${stable}</div></div>
    </div>
    ${shopCard(m)}`;
  document.querySelectorAll('[data-sh]').forEach((b) => b.onclick = () => { shopTab = b.dataset.sh; render(); });
  document.querySelectorAll('[data-cm]').forEach((b) => b.onclick = () => { chartMetric = b.dataset.cm; render(); });
  document.querySelectorAll('[data-st]').forEach((b) => b.onclick = () => { srcTab = b.dataset.st; render(); });
}
const GENERIC = /^아이티켓 - /;
const nm = (r) => (D.names && D.names[shopTab] && D.names[shopTab][r.id]) || (r.title && !GENERIC.test(r.title) ? r.title : '#' + r.id + ' (이름 확인 중)');
function shopCard(m) {
  const tabs = [['goods', '인기 상품'], ['categories', '인기 카테고리'], ['boards', '인기 게시판']];
  const list = m[shopTab];
  const head = `<h2 style="margin-top:14px">고도몰 인기 항목 <span style="color:var(--sub);font-size:12px;font-weight:400">쇼핑몰 URL 기준 조회수</span> ${seg(tabs, shopTab, 'sh')}</h2>`;
  if (!list) return `<div class="card" style="margin-top:14px"><h2>고도몰 인기 항목</h2><div class="empty">이 달은 아직 집계 전입니다. 수집기가 과거 월을 순서대로 채우는 중이면 잠시 후 나타납니다.</div></div>`;
  const tot = list.reduce((a, r) => a + r.views, 0) || 1, mx = Math.max(1, ...list.map((r) => r.views));
  const label = { goods: '상품번호', categories: '카테고리 코드', boards: '게시판 ID' }[shopTab];
  const body = list.length ? `<table><thead><tr><th>#</th><th>이름(페이지 제목)</th><th>${label}</th><th class="n">조회수</th><th class="n">비율</th></tr></thead><tbody>${list.slice(0, 30).map((r, i) => `<tr><td>${i + 1}</td><td><span class="tx" title="${esc(nm(r))}">${esc(nm(r))}</span><span class="sh" style="width:${Math.max(2, r.views / mx * 100)}%"></span></td><td>${esc(r.id)}</td><td class="n">${fmt(r.views)}</td><td class="n">${(r.views / tot * 100).toFixed(1)}%</td></tr>`).join('')}</tbody></table>` : '<div class="empty">데이터 없음</div>';
  return `<div class="card">${head.replace('margin-top:14px', 'margin-top:0')}<div class="tw">${body}</div></div>`;
}
function k2v(r, m) { const s = (m.signups || []).find((x) => x.date === r.date); return { ...r, signups: s ? s.count : 0 }; }

function renderYear(y) {
  const ks = Array.from({ length: 12 }, (_, i) => `${y}-${String(i + 1).padStart(2, '0')}`);
  const val = (k, key) => D.months[k] ? metricOf(D.months[k], key) : 0;
  const vals = ks.map((k) => val(k, annMetric));
  const sum = (key) => ks.reduce((a, k) => a + val(k, key), 0);
  const py = Number(y) - 1;
  const psum = (key) => { const p = Array.from({ length: 12 }, (_, i) => D.months[`${py}-${String(i + 1).padStart(2, '0')}`]).filter(Boolean); return p.length ? p.reduce((a, m) => a + metricOf(m, key), 0) : null; };
  const have = ks.filter((k) => D.months[k]).length;
  const cards = [['세션', 'sessions'], ['페이지뷰', 'screenPageViews'], ['신규 방문자', 'newUsers'], ['회원가입', 'signups']].map(([l, key]) => `<div class="kpi"><div class="l">${l} (${y}년 누계)</div><div class="v">${fmt(sum(key))}</div>${have === 12 ? dl(sum(key), psum(key), '전년') : ''}</div>`);
  const rowsHtml = ks.map((k, i) => { const m = D.months[k]; return `<tr class="${m ? 'link' : ''}" data-s="${m ? k : ''}"><td>${i + 1}월${m && m.partial ? ' <span style="color:var(--sub)">(진행 중)</span>' : ''}</td>${m ? ['activeUsers', 'sessions', 'screenPageViews', 'newUsers', 'signups'].map((key) => `<td class="n">${fmt(metricOf(m, key))}</td>`).join('') : '<td class="n" colspan="5" style="color:var(--sub)">―</td>'}</tr>`; }).join('');
  $('main').innerHTML = `
    <div class="kpis">${cards.join('')}</div>
    <div class="card"><h2>월별 추이 ${seg(METRICS, annMetric, 'am')}</h2>${bars(vals, ks.map((_, i) => `${i + 1}월`), { onClick: true })}</div>
    <div class="card"><h2>월별 요약 <span style="color:var(--sub);font-size:12px;font-weight:400">행을 누르면 해당 월로 이동 · 방문자는 월별 값(중복 포함)이라 합계를 내지 않습니다</span></h2><div class="tw"><table><thead><tr><th>월</th><th class="n">방문자</th><th class="n">세션</th><th class="n">페이지뷰</th><th class="n">신규 방문자</th><th class="n">회원가입</th></tr></thead><tbody>${rowsHtml}</tbody><tfoot><tr><td><b>합계</b></td><td class="n">―</td>${['sessions', 'screenPageViews', 'newUsers', 'signups'].map((key) => `<td class="n"><b>${fmt(sum(key))}</b></td>`).join('')}</tr></tfoot></table></div></div>`;
  document.querySelectorAll('[data-am]').forEach((b) => b.onclick = () => { annMetric = b.dataset.am; render(); });
  document.querySelectorAll('tr.link').forEach((r) => r.onclick = () => go(r.dataset.s));
  document.querySelectorAll('rect.hit').forEach((r) => r.onclick = () => { const k = ks[+r.dataset.i]; if (D.months[k]) go(k); });
}

function render() {
  header();
  if (!keys.length) { $('main').innerHTML = '<div class="empty">아직 수집된 데이터가 없습니다.<br>저장소의 Actions에서 “Update Dashboard”를 실행하면 첫 수집이 시작됩니다.</div>'; return; }
  if (/^\d{4}$/.test(sel)) renderYear(sel); else renderMonth(sel);
}
// ── 실시간: GA4 Realtime API(최근 30분)를 Apps Script 웹앱으로 30초마다 직접 조회 ──
const liveUrl = D.liveUrl || '';
let lastLiveOk = 0;
function renderLive(l, err) {
  const box = $('liveBox');
  if (!liveUrl) { box.innerHTML = ''; return; }
  if (!l) { box.innerHTML = `<div class="live"><div><div class="l"><span class="dot off"></span>실시간</div><div class="n" style="font-size:18px">${err ? '연결 대기 중…' : '불러오는 중…'}</div></div></div>`; return; }
  const mins = Array(30).fill(0);
  (l.minutes || []).forEach((r) => { const i = +r.minutesAgo; if (i >= 0 && i < 30) mins[29 - i] = r.activeUsers; });
  const mx = Math.max(1, ...mins);
  const spark = `<svg viewBox="0 0 300 44" preserveAspectRatio="none" role="img">${mins.map((v, i) => `<rect class="b" x="${i * 10 + 1}" y="${44 - Math.max(1.5, v / mx * 42)}" width="8" height="${Math.max(1.5, v / mx * 42)}" rx="1.5"><title>${30 - i}분 전: ${v}명</title></rect>`).join('')}</svg>`;
  const pages = (l.pages || []).slice(0, 5).map((r) => `<li><span title="${esc(r.unifiedScreenName)}">${esc(r.unifiedScreenName || '(제목 없음)')}</span><span>${fmt(r.activeUsers)}명</span></li>`).join('') || '<li><span style="color:var(--sub)">지금 보는 페이지 없음</span></li>';
  const dev = (l.devices || []).map((r) => `${{ desktop: 'PC', mobile: '모바일', tablet: '태블릿' }[r.deviceCategory] || r.deviceCategory} ${fmt(r.activeUsers)}`).join(' · ');
  const ago = Math.max(0, Math.round((Date.now() - new Date(l.at)) / 1000));
  box.innerHTML = `<div class="live"><div><div class="l"><span class="dot"></span>지금 접속 중 (최근 30분)</div><div class="n">${fmt(l.activeUsers)}명</div><div class="l">${dev || '&nbsp;'} · ${ago < 5 ? '방금' : ago + '초 전'} 갱신</div></div><div><div class="l" style="margin-bottom:2px">분당 접속자 (30분)</div>${spark}</div><div><div class="l" style="margin-bottom:2px">지금 보는 페이지</div><ul>${pages}</ul></div></div>`;
}
async function pollLive() {
  if (!liveUrl || document.visibilityState === 'hidden') return;
  try {
    const r = await fetch(liveUrl + '?mode=live');
    const j = await r.json();
    if (j.error || typeof j.activeUsers !== 'number') throw new Error(j.error || 'bad live payload');
    lastLiveOk = Date.now(); renderLive(j);
  } catch (e) { if (!lastLiveOk) renderLive(null, true); }
}
// 당월 수치: 수집기가 15분마다 갱신 → 화면은 2분마다 가져와 바뀐 경우에만 다시 그린다
async function pollCur() {
  if (!liveUrl || document.visibilityState === 'hidden') return;
  try {
    const j = await (await fetch(liveUrl + '?mode=cur')).json();
    if (!j.months) return;
    let changed = false;
    for (const k of Object.keys(j.months)) {
      const old = D.months[k];
      if (!old || old.updated !== j.months[k].updated) { D.months[k] = j.months[k]; changed = true; }
    }
    if (j.updated && j.updated !== D.meta.updated) { D.meta.updated = j.updated; changed = true; }
    if (changed) { const y = scrollY; render(); scrollTo(0, y); }
  } catch (e) {}
}
if (liveUrl) { renderLive(null); pollLive(); pollCur(); setInterval(pollLive, 30000); setInterval(pollCur, 120000); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { pollLive(); pollCur(); } }); }
$('refresh').onclick = async () => {
  if (!liveUrl) { location.reload(); return; }
  const b = $('refresh'); b.disabled = true; b.classList.add('spin');
  await Promise.all([pollLive(), pollCur()]);
  b.disabled = false; b.classList.remove('spin'); header();
};
addEventListener('hashchange', () => { const s = location.hash.slice(1); if (s && s !== sel && (D.months[s] || years.includes(s))) { sel = s; render(); } });
render();
</script>
