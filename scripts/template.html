<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>아이티켓 애널리틱스 월간 리포트</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--sub:#6b7686;--line:#e4e8ee;--acc:#2563eb;--accbg:#e8f0fe;--up:#0f9d58;--down:#d93025;--warn:#b26a00;--warnbg:#fff4e0;--bar:#bcd2fb}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10141b;--card:#181e28;--ink:#e6eaf0;--sub:#92a0b3;--line:#2a3342;--acc:#6ea0ff;--accbg:#1c2a46;--up:#4cc38a;--down:#ff7b72;--warn:#f0b04a;--warnbg:#3a2d12;--bar:#2c4a85}}
:root[data-theme=dark]{--bg:#10141b;--card:#181e28;--ink:#e6eaf0;--sub:#92a0b3;--line:#2a3342;--acc:#6ea0ff;--accbg:#1c2a46;--up:#4cc38a;--down:#ff7b72;--warn:#f0b04a;--warnbg:#3a2d12;--bar:#2c4a85}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Pretendard","Malgun Gothic",system-ui,sans-serif}
a{color:var(--acc)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1;min-width:200px}
header small{color:var(--sub);font-weight:400;margin-left:6px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:16px;display:grid;grid-template-columns:220px 1fr;gap:16px}
nav{position:sticky;top:64px;align-self:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;max-height:calc(100vh - 80px);overflow:auto}
nav a{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
nav a:hover,nav a.on{background:var(--accbg);color:var(--acc)}
nav a .miss{color:var(--warn);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{color:var(--sub);font-size:13px}
.kpi .v{font-size:26px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.d{font-size:12.5px;font-weight:600}.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--sub)}
.notice{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;scroll-margin-top:76px}
section>h2{margin:0;padding:14px 16px;font-size:16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
section>h2 .chev{color:var(--sub);transition:transform .15s}
section.closed>h2 .chev{transform:rotate(-90deg)}
section.closed .body{display:none}
.body{padding:0 16px 16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tools{display:flex;gap:8px;margin:4px 0 8px;align-items:center;flex-wrap:wrap}
.tools input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;min-width:160px}
.tools .note{color:var(--sub);font-size:12.5px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:480px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
td.n,th.n{text-align:right}
th{position:sticky;top:0;background:var(--card);cursor:pointer;user-select:none;font-weight:600}
th.s::after{content:" ▲"}th.s.desc::after{content:" ▼"}
tr:last-child td{border-bottom:0}
td .bar{display:block;margin-left:auto;height:3px;background:var(--bar);border-radius:2px;margin-top:3px}
.empty{color:var(--sub);padding:18px;text-align:center}
.idx a.row{display:grid;grid-template-columns:100px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;color:var(--ink);text-decoration:none}
.idx .m{font-weight:700;font-size:17px}
.pill{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--accbg);color:var(--acc)}
.pill.w{background:var(--warnbg);color:var(--warn)}
.sp{display:flex;gap:14px;flex-wrap:wrap;color:var(--sub);font-size:13px}
@media (max-width:820px){.wrap{grid-template-columns:1fr;padding:12px}nav{position:static;display:flex;gap:4px;overflow:auto;max-height:none;white-space:nowrap}nav a{flex:0 0 auto}.idx a.row{grid-template-columns:1fr}}
@media print{header,nav,.tools,.tabs{display:none}.wrap{display:block}section.closed .body{display:block}.tw{max-height:none}}
</style>
</head>
<body>
<header><h1 id="ttl">아이티켓 애널리틱스 월간 리포트</h1><button class="btn" id="theme">테마</button><button class="btn" onclick="window.print()">인쇄/PDF</button></header>
<div id="app"></div>
<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent.replace(/^\/\*__DATA__\*\//,'')||'null');
const $ = (h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const esc = (s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = (v)=>{if(typeof v==='number')return v;if(typeof v!=='string')return null;const t=v.trim().replace(/,/g,'');return /^-?\d+(\.\d+)?%?$/.test(t)?parseFloat(t):null};
const fmt = (n)=>Number.isInteger(n)?n.toLocaleString('ko-KR'):n.toLocaleString('ko-KR',{maximumFractionDigits:2});
const delta = (cur,prev)=>{
  if(prev==null||cur==null)return '';
  if(prev===0)return cur===0?'':'<span class="d up">신규</span>';
  const p=(cur-prev)/Math.abs(prev)*100;
  if(Math.abs(p)<0.05)return '<span class="d flat">―</span>';
  return `<span class="d ${p>0?'up':'down'}">${p>0?'▲':'▼'} ${Math.abs(p).toFixed(1)}%</span>`;
};
try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
document.getElementById('theme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('theme',r.dataset.theme)}catch(e){}};

const app=document.getElementById('app');
if(D&&D.index)renderIndex();else if(D)renderReport();else app.innerHTML='<div class="empty">데이터가 없습니다.</div>';

function renderIndex(){
  const rows=D.index.map(s=>`<a class="row" href="${s.month}.html"><span class="m">${s.month}</span>
    <span class="sp">${s.kpis.map(k=>`<span>${esc(k.label)} <b style="color:var(--ink)">${k.value==null?'―':fmt(k.value)}</b> ${delta(k.value,k.prev)}</span>`).join('')}</span>
    <span class="pill ${s.have<s.total?'w':''}">메뉴 ${s.have}/${s.total}</span></a>`).join('');
  app.innerHTML=`<div class="wrap" style="display:block;max-width:900px"><div class="idx">${rows||'<div class="empty">리포트가 없습니다.</div>'}</div></div>`;
}

function renderReport(){
  const [y,m]=D.month.split('-');
  document.title=`${y}년 ${+m}월 애널리틱스 리포트`;
  document.getElementById('ttl').innerHTML=`${y}년 ${+m}월 애널리틱스 리포트<small>${D.prevMonth?`전월(${D.prevMonth}) 대비`:'비교할 전월 데이터 없음'}</small>`;
  const missing=D.menus.filter(x=>x.missing);
  const nav=D.menus.map(x=>`<a href="#m-${x.key}" data-k="${x.key}"><span>${esc(x.name)}</span>${x.missing?'<span class="miss">누락</span>':''}</a>`).join('');
  const kp=D.kpis.map(k=>`<div class="kpi"><div class="l">${esc(k.label)}</div><div class="v">${k.value==null?'―':fmt(k.value)}</div>${delta(k.value,k.prev)}</div>`).join('');
  const notice=(missing.length?`<div class="notice">아직 올라오지 않은 메뉴 ${missing.length}개: ${missing.map(x=>esc(x.name)).join(', ')}</div>`:'')
    +(D.unknown.length?`<div class="notice">인식하지 못한 파일: ${D.unknown.map(esc).join(', ')} (파일명을 <b>메뉴명__옵션.xlsx</b> 형식으로 맞춰 주세요)</div>`:'');
  app.innerHTML=`<div class="wrap"><nav>${nav}</nav><main><div class="kpis">${kp}</div>${notice}<div id="secs"></div></main></div>`;
  const secs=document.getElementById('secs');
  D.menus.forEach(menu=>{
    const sec=$(`<section id="m-${menu.key}"><h2><span>${esc(menu.name)}</span><span class="chev">▾</span></h2><div class="body"></div></section>`);
    sec.querySelector('h2').onclick=()=>sec.classList.toggle('closed');
    const body=sec.querySelector('.body');
    if(menu.missing){sec.classList.add('closed');body.innerHTML='<div class="empty">이 달 데이터가 아직 없습니다.</div>'}
    else renderMenu(menu,body);
    secs.appendChild(sec);
  });
  const links=[...document.querySelectorAll('nav a')];
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){links.forEach(a=>a.classList.toggle('on',a.dataset.k===e.target.id.slice(2)))}}),{rootMargin:'-20% 0px -70% 0px'});
  document.querySelectorAll('section').forEach(s=>io.observe(s));
}

function renderMenu(menu,body){
  const opts=menu.options;
  const tabs=$(`<div class="tabs"></div>`);
  const view=$(`<div></div>`);
  const show=(i)=>{[...tabs.children].forEach((b,j)=>b.classList.toggle('on',j===i));view.innerHTML='';opts[i].sheets.forEach(s=>view.appendChild(renderSheet(menu,opts[i],s)));if(!opts[i].sheets.length)view.innerHTML='<div class="empty">표 데이터가 없습니다.</div>'};
  if(opts.length>1||opts[0].option!=='전체'){opts.forEach((o,i)=>{const b=$(`<button class="tab">${esc(o.option)}</button>`);b.onclick=()=>show(i);tabs.appendChild(b)});body.appendChild(tabs)}
  else tabs.appendChild($('<button class="tab on">전체</button>'));
  body.appendChild(view);show(0);
}

function renderSheet(menu,opt,s){
  const wrap=$('<div></div>');
  const numCols=s.header.map((_,ci)=>s.rows.length&&s.rows.filter(r=>num(r[ci])!=null).length>=s.rows.length*0.6&&ci>0);
  const firstNum=numCols.indexOf(true);
  let data=s.rows.map(r=>r.slice()),sortCi=-1,desc=true,q='';
  const maxv=firstNum>=0?Math.max(1,...data.map(r=>Math.abs(num(r[firstNum])||0))):1;
  const tools=$(`<div class="tools"><input placeholder="검색" aria-label="검색"><span class="note">${esc(s.name)}${s.note?' · '+esc(s.note):''} · ${s.rows.length.toLocaleString()}행</span></div>`);
  const tw=$('<div class="tw"></div>');
  const draw=()=>{
    let rows=data.filter(r=>!q||r.some(c=>String(c).toLowerCase().includes(q)));
    if(sortCi>=0)rows=rows.slice().sort((a,b)=>{const x=numCols[sortCi]?num(a[sortCi]):String(a[sortCi]),y=numCols[sortCi]?num(b[sortCi]):String(b[sortCi]);return (x>y?1:x<y?-1:0)*(desc?-1:1)});
    const shown=rows.slice(0,500);
    tw.innerHTML=`<table><thead><tr>${s.header.map((h,i)=>`<th data-i="${i}" class="${numCols[i]?'n':''} ${i===sortCi?'s '+(desc?'desc':''):''}">${esc(h)}</th>`).join('')}</tr></thead><tbody>${
      shown.map(r=>`<tr>${r.map((c,i)=>{
        if(!numCols[i])return `<td>${esc(c)}</td>`;
        const n=num(c);const pv=D.prevMap[[menu.key,opt.option,s.name,r[0],s.header[i]].join('|')];
        const bar=i===firstNum&&n!=null?`<span class="bar" style="width:${Math.max(2,Math.abs(n)/maxv*100)}%"></span>`:'';
        return `<td class="n">${esc(c)} ${delta(n,pv)}${bar}</td>`}).join('')}</tr>`).join('')||`<tr><td class="empty" colspan="${s.header.length}">결과 없음</td></tr>`}</tbody></table>${rows.length>500?`<div class="empty">상위 500행만 표시 (검색으로 좁혀 보세요)</div>`:''}`;
    tw.querySelectorAll('th').forEach(th=>th.onclick=()=>{const i=+th.dataset.i;desc=(sortCi===i)?!desc:numCols[i];sortCi=i;draw()});
  };
  tools.querySelector('input').oninput=(e)=>{q=e.target.value.toLowerCase();draw()};
  wrap.append(tools,tw);draw();return wrap;
}
</script>
</body>
</html>
